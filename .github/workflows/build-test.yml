name: Build Test

on:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: ${{ matrix.java-distribution || 'temurin' }}
        java-version: 25

    - name: Install mingw binutils for launch4j (Linux non-x86)
      if: runner.os == 'Linux' && runner.arch != 'X64' && runner.arch != 'X86'
      run: sudo apt-get update && sudo apt-get install -y 
        binutils-mingw-w64-i686

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build
      run: ./gradlew build dist distWin
      env:
        JADX_BUILD_JAVA_VERSION: 11
    name: tests [${{ matrix.expander_leg }}]
    timeout-minutes: 150
